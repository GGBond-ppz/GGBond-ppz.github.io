<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app" style="color: pink; font-size: 20px">
      <span>{{fullname}} {{fullname}} {{fullname}}</span>
    </div>

    <script src="../dist/vue.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/vue@2"></script> -->
    <script>
      const vm = new Vue({
        el: "#app",
        data() {
          return {
            msg: "Vue",
            msg2: "Hello",
          };
        },
        computed: {
          fullname() {
            return this.msg + this.msg2;
          },
        },
      });

      setTimeout(() => {
        vm.msg = "123";
      }, 1000);
    </script>
  </body>
</html>
